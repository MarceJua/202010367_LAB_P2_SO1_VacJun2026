# ==========================================
# DEPLOYMENT 1: Go Server (gRPC + RabbitMQ Writer)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-server
  template:
    metadata:
      labels:
        app: go-server
    spec:
      containers:
      - name: go-server
        image: us-central1-docker.pkg.dev/deep-clock-500019-v8/quiniela-repo/go-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 50051
        env:
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672/"
---
apiVersion: v1
kind: Service
metadata:
  name: go-server
spec:
  selector:
    app: go-server
  ports:
  - port: 50051
    targetPort: 50051

---
# ==========================================
# DEPLOYMENT 2: Go Client (REST + gRPC Client)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-client
  template:
    metadata:
      labels:
        app: go-client
    spec:
      containers:
      - name: go-client
        image: us-central1-docker.pkg.dev/deep-clock-500019-v8/quiniela-repo/go-client:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        env:
        - name: GRPC_SERVER_ADDR
          value: "go-server:50051"
---
apiVersion: v1
kind: Service
metadata:
  name: go-client
spec:
  selector:
    app: go-client
  ports:
  - port: 8081
    targetPort: 8081
