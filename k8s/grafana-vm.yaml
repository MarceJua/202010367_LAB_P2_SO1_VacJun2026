apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: grafana-vm
  labels:
    app: grafana-vm
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: grafana-vm
        app: grafana-vm
    spec:
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 2048M
        devices:
          disks:
          - name: containerdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
            ports:
            - port: 3000
            - port: 22
      networks:
      - name: default
        pod: {}
      volumes:
      - name: containerdisk
        containerDisk:
          image: quay.io/containerdisks/debian:12
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            chpasswd:
              list: |
                debian:root
                root:root
              expire: False
            ssh_pwauth: True
            runcmd:
              # 1. Forzar acceso SSH por contraseña (por si necesitamos debug)
              - sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
              - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
              - systemctl restart ssh
              # 2. Instalar dependencias base
              - apt-get update
              - apt-get install -y adduser libfontconfig1 musl curl
              # 3. Descargar e instalar Grafana nativo (Sin Docker)
              - curl -O https://dl.grafana.com/oss/release/grafana_10.4.2_amd64.deb
              - dpkg -i grafana_10.4.2_amd64.deb
              # 4. Iniciar y habilitar el servicio de Grafana
              - systemctl enable grafana-server
              - systemctl start grafana-server
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
    name: grafana-web
  - port: 2222
    targetPort: 22
    name: ssh-access
  selector:
    app: grafana-vm
